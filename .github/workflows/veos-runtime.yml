name: VeOS runtime

on:
  pull_request:
    branches: [master, ve/feat/mission-runtime, ve/feat/agent-controls, ve/feat/harness-portability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veos-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-ok:
    runs-on: ubuntu-24.04
    needs: [runtime, native-controls, hermes]
    if: always()
    steps:
      - name: Require all runtime qualification jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json, os; assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values())'

  hermes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/veos-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the pinned native Hermes source
        run: |
          mkdir -p artifacts
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-source"
          git -C "$RUNNER_TEMP/hermes-source" checkout --detach 2de9f51b8008a7d49a49221c184f2f11cbfc4af1
          python3 -m venv "$RUNNER_TEMP/hermes-tools"
          "$RUNNER_TEMP/hermes-tools/bin/python" -m pip install uv==0.12.5
          "$RUNNER_TEMP/hermes-tools/bin/uv" venv --python 3.14 "$RUNNER_TEMP/hermes-env"
      - name: Install using Hermes's own dependency overrides
        working-directory: ${{ runner.temp }}/hermes-source
        run: |
          "$RUNNER_TEMP/hermes-tools/bin/uv" pip install --python "$RUNNER_TEMP/hermes-env/bin/python" -e '.[mcp]' > "$GITHUB_WORKSPACE/packages/veos-runtime/artifacts/hermes-install.log" 2>&1
      - name: Qualify the real gateway and VeOS MCP
        run: |
          PYTHONPATH=src python3 tests/hermes_native_smoke.py "$RUNNER_TEMP/hermes-env/bin/hermes" > artifacts/hermes-native.log 2>&1 || { cat artifacts/hermes-native.log; exit 1; }
          cat artifacts/hermes-native.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: veos-hermes-checks
          path: packages/veos-runtime/artifacts/
          retention-days: 14

  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/veos-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install isolated test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/veos-tests"
          echo "$RUNNER_TEMP/veos-tests/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/veos-tests/bin/python" -m pip install '.[browser]' build ruff
          "$RUNNER_TEMP/veos-tests/bin/python" -m playwright install --with-deps chromium
      - name: Check runtime logic and syntax
        run: |
          mkdir -p artifacts
          PYTHONPATH=src python -m unittest discover -s tests -v > artifacts/runtime-tests.log 2>&1
          cat artifacts/runtime-tests.log
          ruff check src tests
          ruff format src tests --check
          node --check src/veos_runtime/web/app.js
          node --check src/veos_runtime/web/voice.js
          node --test tests/voice_client.test.cjs > artifacts/voice-client.log 2>&1
          cat artifacts/voice-client.log
      - name: Build and verify the installed wheel
        run: |
          python -m build --wheel
          python3 -m venv "$RUNNER_TEMP/veos-wheel"
          "$RUNNER_TEMP/veos-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/veos-wheel/bin/python" tests/installed_smoke.py > artifacts/installed-smoke.log 2>&1
          cat artifacts/installed-smoke.log
      - name: Exercise the real local browser and Mission Desk
        run: |
          PYTHONPATH=src python tests/local_browser_smoke.py > artifacts/browser-control.log 2>&1
          cat artifacts/browser-control.log
          PYTHONPATH=src python tests/browser_smoke.py > artifacts/mission-desk.log 2>&1
          cat artifacts/mission-desk.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: veos-runtime-checks
          path: packages/veos-runtime/artifacts/
          retention-days: 14

  native-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: packages/veos-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise native accessibility and document readers
        run: |
          mkdir -p artifacts
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi gir1.2-atspi-2.0 gir1.2-gtk-3.0 at-spi2-core xvfb dbus-x11 python3-pil poppler-utils tesseract-ocr fonts-dejavu-core
          PYTHONPATH=src NO_AT_BRIDGE=0 GTK_MODULES=atk-bridge dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/native_accessibility_smoke.py > artifacts/native-accessibility.log 2>&1 || { cat artifacts/native-accessibility.log; exit 1; }
          cat artifacts/native-accessibility.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: veos-native-controls-checks
          path: packages/veos-runtime/artifacts/
          retention-days: 14
