name: VeOS runtime

on:
  pull_request:
    branches: [master, ve/feat/mission-runtime]
    paths:
      - 'packages/veos-runtime/**'
      - '.github/workflows/veos-runtime.yml'
      - 'docs/veos-runtime.md'
      - 'docs/veos-agent-controls.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veos-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/veos-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install isolated test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/veos-tests"
          echo "$RUNNER_TEMP/veos-tests/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/veos-tests/bin/python" -m pip install '.[browser]' build ruff
          "$RUNNER_TEMP/veos-tests/bin/python" -m playwright install --with-deps chromium
      - name: Check runtime logic and syntax
        run: |
          mkdir -p artifacts
          PYTHONPATH=src python -m unittest discover -s tests -v > artifacts/runtime-tests.log 2>&1
          cat artifacts/runtime-tests.log
          ruff check src tests
          ruff format src tests --check
          node --check src/veos_runtime/web/app.js
          node --check src/veos_runtime/web/voice.js
          node --test tests/voice_client.test.cjs > artifacts/voice-client.log 2>&1
          cat artifacts/voice-client.log
      - name: Build and verify the installed wheel
        run: |
          python -m build --wheel
          python3 -m venv "$RUNNER_TEMP/veos-wheel"
          "$RUNNER_TEMP/veos-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/veos-wheel/bin/python" tests/installed_smoke.py > artifacts/installed-smoke.log 2>&1
          cat artifacts/installed-smoke.log
      - name: Exercise the real local browser and Mission Desk
        run: |
          PYTHONPATH=src python tests/local_browser_smoke.py > artifacts/browser-control.log 2>&1
          cat artifacts/browser-control.log
          PYTHONPATH=src python tests/browser_smoke.py > artifacts/mission-desk.log 2>&1
          cat artifacts/mission-desk.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: veos-runtime-checks
          path: packages/veos-runtime/artifacts/
          retention-days: 14

  native-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: packages/veos-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise native accessibility and document readers
        run: |
          mkdir -p artifacts
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi gir1.2-atspi-2.0 gir1.2-gtk-3.0 at-spi2-core xvfb dbus-x11 python3-pil poppler-utils tesseract-ocr fonts-dejavu-core
          PYTHONPATH=src NO_AT_BRIDGE=0 GTK_MODULES=atk-bridge dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/native_accessibility_smoke.py > artifacts/native-accessibility.log 2>&1 || { cat artifacts/native-accessibility.log; exit 1; }
          cat artifacts/native-accessibility.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: veos-native-controls-checks
          path: packages/veos-runtime/artifacts/
          retention-days: 14
